    <meta name="description" content="第6章 在线贝叶斯估计 在线贝叶斯估计的原理 在线贝叶斯估计适用于观测依次到来的情况 在拿到每一个新观测的时候，并不需要根据所有的观测来重新计算后验概率，而是在之前的后验概率基础上，用新的观测来更新。 在线贝叶斯估计的关键是用当前的观测更新上一次的后验概率 每次有了一个新的观测，就把迄今为止所有的观测放在一起，用相应的贝叶斯公式来计算在所有观测下的后验概率。 在线贝叶斯公式 在线贝叶斯公式是后验概率的迭代形式 在t=1时刻，拿到观测A1，我们可以基于贝叶斯定理的原始形式，得到后验概率P (H|A1)。 在t2时刻，进一步拿到观测A2。我们可以推导出来，后验概率P (H|A1, A2)可以写成如下的迭代形式。 在线贝叶斯公式适用于多个独立的观测依次到来的情况 对于任何一个时间点tk，我们把这个时间点之前的所有观测A1, … , Ak-1，都放入“历史观测集合” 中，Ak是“当前观测”，合在一起就是“迄今为止所有的观测集合” ，那么我们有。 在线贝叶斯估计给我们的启发 “先验概率”和“后验概率”都是相对于某个具体时间点而言的 同一个概率，对于某个时间点是先验概率，但对另外一个时间点又可能是后验概率。 我们扩充了贝叶斯公式中“先验概率”的定义 原始贝叶斯定理中的先验概率P (H)，表面上不基于任何观测，但实际上是基于历史上所有观测的。 当前先验概率，实际上是历史的后验概率。或者说，先验概率是对所有历史积累信息的沉淀和总结。 ">
